<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LeetCode 250 Tracker</title>
<style>
  :root{
    --bg:#F6F5F1; --panel:#FFFFFF; --border:#DEDBD2; --border-strong:#C7C3B6;
    --text:#22221F; --text-2:#5B584F; --text-muted:#8C887C;
    --accent:#1F7A63; --accent-bg:#E4F1EC;
    --easy:#2E8B57; --easy-bg:#E4F3EA;
    --med:#B8860B; --med-bg:#FBF1DC;
    --hard:#B23A3A; --hard-bg:#FBE7E5;
    --mono:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#15171A; --panel:#1D2024; --border:#2C3036; --border-strong:#3C4248;
      --text:#E9E8E4; --text-2:#B4B1A9; --text-muted:#7C7A74;
      --accent:#3FCBA8; --accent-bg:#122A24;
      --easy:#3FCB86; --easy-bg:#12261C;
      --med:#E0B23D; --med-bg:#2A2211;
      --hard:#E06A63; --hard-bg:#2A1614;
    }
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);}
  .wrap{max-width:760px;margin:0 auto;padding:24px 20px 60px;}
  header{position:sticky;top:0;background:var(--bg);padding:8px 0 16px;z-index:5;}
  h1{font-size:20px;font-weight:600;margin:0 0 4px;letter-spacing:-0.01em;}
  .sub{color:var(--text-2);font-size:13px;margin:0 0 16px;}
  .progress-row{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
  .bar{flex:1;height:8px;border-radius:4px;background:var(--border);overflow:hidden;}
  .bar-fill{height:100%;background:var(--accent);width:0%;transition:width .25s ease;}
  .pct{font-family:var(--mono);font-size:13px;color:var(--text-2);min-width:64px;text-align:right;}
  input[type=text]{width:100%;padding:9px 12px;border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--text);font-size:14px;outline:none;}
  input[type=text]:focus{border-color:var(--accent);}
  .filters{display:flex;gap:6px;margin-top:10px;}
  .chip{padding:5px 11px;border-radius:16px;border:1px solid var(--border);background:var(--panel);color:var(--text-2);font-size:12px;cursor:pointer;user-select:none;}
  .chip.active{border-color:var(--accent);color:var(--accent);background:var(--accent-bg);}
  details{background:var(--panel);border:1px solid var(--border);border-radius:10px;margin-bottom:10px;overflow:hidden;}
  summary{list-style:none;cursor:pointer;padding:13px 16px;display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:600;}
  summary::-webkit-details-marker{display:none;}
  summary .cat-count{font-family:var(--mono);font-weight:400;font-size:12px;color:var(--text-muted);}
  .arrow{transition:transform .15s ease;color:var(--text-muted);}
  details[open] .arrow{transform:rotate(90deg);}
  .rows{border-top:1px solid var(--border);}
  .row{display:flex;align-items:center;gap:11px;padding:10px 16px;border-bottom:1px solid var(--border);}
  .row:last-child{border-bottom:none;}
  .row.hidden{display:none;}
  .row input[type=checkbox]{width:17px;height:17px;flex:none;accent-color:var(--accent);cursor:pointer;}
  .row a{color:var(--text);text-decoration:none;font-family:var(--mono);font-size:13.5px;flex:1;}
  .row a:hover{color:var(--accent);text-decoration:underline;}
  .row.done a{color:var(--text-muted);text-decoration:line-through;}
  .diff{font-size:11px;font-weight:600;padding:2px 8px;border-radius:5px;flex:none;}
  .diff.E{color:var(--easy);background:var(--easy-bg);}
  .diff.M{color:var(--med);background:var(--med-bg);}
  .diff.H{color:var(--hard);background:var(--hard-bg);}
  .empty{padding:24px;text-align:center;color:var(--text-muted);font-size:13px;}
  .toolbar{display:flex;gap:8px;margin-top:14px;}
  button.reset{padding:7px 12px;border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--text-2);font-size:12px;cursor:pointer;}
  button.reset:hover{border-color:var(--border-strong);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>LeetCode 250 Tracker</h1>
    <p class="sub">Check off problems as you solve them. Progress is saved automatically to your account.</p>
    <div class="progress-row">
      <div class="bar"><div class="bar-fill" id="barFill"></div></div>
      <div class="pct" id="pctLabel">0 / 250</div>
    </div>
    <input type="text" id="search" placeholder="Search a problem name...">
    <div class="filters" id="filters">
      <div class="chip active" data-f="all">All</div>
      <div class="chip" data-f="E">Easy</div>
      <div class="chip" data-f="M">Medium</div>
      <div class="chip" data-f="H">Hard</div>
      <div class="chip" data-f="unsolved">Unsolved</div>
    </div>
    <div class="toolbar">
      <button class="reset" id="resetBtn">Reset all progress</button>
    </div>
  </header>
  <div id="list"></div>
</div>

let solved = {};
let currentFilter = "all";
let searchTerm = "";
const TOTAL = categories.reduce((s,c)=>s+c[1].length,0);

async function loadProgress(){
  try{
    const res = await window.storage.get('lc250-progress', false);
    if(res && res.value) solved = JSON.parse(res.value);
  }catch(e){ solved = {}; }
  render();
}
async function saveProgress(){
  try{ await window.storage.set('lc250-progress', JSON.stringify(solved), false); }
  catch(e){ console.error('Save failed', e); }
}

function render(){
  const list = document.getElementById('list');
  list.innerHTML = '';
  let doneTotal = 0;

  categories.forEach((cat, ci)=>{
    const [catName, problems] = cat;
    let catDone = 0;
    const rows = problems.map((p, pi)=>{
      const id = ci+'-'+pi;
      const isDone = !!solved[id];
      if(isDone){ catDone++; doneTotal++; }
      const matchesSearch = p[0].toLowerCase().includes(searchTerm);
      const matchesFilter = currentFilter==='all' ? true
        : currentFilter==='unsolved' ? !isDone
        : p[1]===currentFilter;
      const visible = matchesSearch && matchesFilter;
      return {id, p, isDone, visible};
    });

    const visibleRows = rows.filter(r=>r.visible);
    if(visibleRows.length===0) return;

    const details = document.createElement('details');
    details.open = searchTerm.length>0 || currentFilter!=='all';
    const summary = document.createElement('summary');
    summary.innerHTML = '<span>'+catName+'</span><span class="cat-count">'+catDone+' / '+problems.length+' <span class="arrow">&#8250;</span></span>';
    details.appendChild(summary);

    const rowsDiv = document.createElement('div');
    rowsDiv.className = 'rows';
    rows.forEach(r=>{
      const rowDiv = document.createElement('div');
      rowDiv.className = 'row' + (r.isDone?' done':'') + (r.visible?'':' hidden');
      const diffLabel = r.p[1]==='E'?'Easy':r.p[1]==='M'?'Medium':'Hard';
      rowDiv.innerHTML =
        '<input type="checkbox" '+(r.isDone?'checked':'')+' data-id="'+r.id+'">'+
        '<a href="https://leetcode.com/problems/'+r.p[2]+'/" target="_blank" rel="noopener">'+r.p[0]+'</a>'+
        '<span class="diff '+r.p[1]+'">'+diffLabel+'</span>';
      rowsDiv.appendChild(rowDiv);
    });
    details.appendChild(rowsDiv);
    list.appendChild(details);
  });

  if(list.children.length===0){
    list.innerHTML = '<div class="empty">No problems match your search or filter.</div>';
  }

  document.getElementById('barFill').style.width = ((doneTotal/TOTAL)*100).toFixed(1)+'%';
  document.getElementById('pctLabel').textContent = doneTotal+' / '+TOTAL;

  list.querySelectorAll('input[type=checkbox]').forEach(cb=>{
    cb.addEventListener('change', (e)=>{
      const id = e.target.getAttribute('data-id');
      if(e.target.checked) solved[id] = true; else delete solved[id];
      saveProgress();
      render();
    });
  });
}

document.getElementById('search').addEventListener('input', (e)=>{
  searchTerm = e.target.value.toLowerCase();
  render();
});

document.getElementById('filters').addEventListener('click', (e)=>{
  const chip = e.target.closest('.chip');
  if(!chip) return;
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  chip.classList.add('active');
  currentFilter = chip.getAttribute('data-f');
  render();
});

document.getElementById('resetBtn').addEventListener('click', ()=>{
  if(confirm('Clear all solved progress? This cannot be undone.')){
    solved = {};
    saveProgress();
    render();
  }
});

loadProgress();
</script>
</body>
</html>
